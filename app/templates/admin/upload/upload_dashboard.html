{% extends "base/base.html" %}
{% block title %}Result Upload PDF{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
{% endblock %}

{% block content %}

<div class="dash-blob dash-blob-1"></div>
<div class="dash-blob dash-blob-2"></div>

<main class="up-page">

  <section class="up-split">

    <!-- Left: title panel -->
    <aside class="up-side">
      <div class="up-side-icon">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="up-side-bottom">
        <h1 class="up-side-title">Upload Dashboard</h1>
        <a href="{{ url_for('admin_dashboard.admin_dashboard') }}" class="up-side-back">← Back</a>
      </div>
    </aside>

    <!-- Right: actions -->
    <nav class="up-list" aria-label="Upload actions">

      <a href="{{ url_for('import_pdf.upload_cgpa') }}" class="up-item up-item-main">
        <span class="up-item-icon">
          <svg viewBox="0 0 24 24">
            <polyline points="16 16 12 12 8 16"/>
            <line x1="12" y1="12" x2="12" y2="21"/>
            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
          </svg>
        </span>
        <span class="up-item-name">Import CGPA PDF</span>
        <span class="up-item-arrow">→</span>
      </a>

      <a href="{{ url_for('view_pdf.view_cgpa_pdfs') }}" class="up-item">
        <span class="up-item-icon">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </span>
        <span class="up-item-name">Show Imported Files</span>
        <span class="up-item-arrow">→</span>
      </a>

      <a href="#" class="up-item">
        <span class="up-item-icon">
          <svg viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </span>
        <span class="up-item-name">Show Fail or Success</span>
        <span class="up-item-arrow">→</span>
      </a>

    </nav>

  </section>

</main>

{% endblock %}
